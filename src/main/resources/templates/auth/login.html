<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Login Admin - Carpentry SYC" />
    <meta name="author" content="Carpentry SYC" />
    <title>Iniciar Sesión - Carpentry SYC</title>
    <link th:href="@{/styles.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-primary">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-5">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header bg-dark text-white">
                                    <h3 class="text-center font-weight-light my-4">
                                        <i class="fas fa-user-circle me-2"></i>Iniciar Sesión
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <!-- Mensaje de error si el login falla -->
                                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                        <i class="fas fa-exclamation-triangle me-2"></i>
                                        <strong>Error:</strong> Usuario o contraseña incorrectos.
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>

                                    <!-- Mensaje de éxito al cerrar sesión -->
                                    <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                                        <i class="fas fa-check-circle me-2"></i>
                                        Has cerrado sesión exitosamente.
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>

                                    <!-- Formulario de login -->
                                    <form th:action="@{/login}" method="post">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="username" name="username" type="text"
                                                   placeholder="Username" required autofocus />
                                            <label for="username">
                                                <i class="fas fa-user me-2"></i>Usuario
                                            </label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="password" name="password" type="password"
                                                   placeholder="Password" required />
                                            <label for="password">
                                                <i class="fas fa-lock me-2"></i>Contraseña
                                            </label>
                                        </div>

                                        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                            <a class="btn btn-link small" th:href="@{/}">
                                                <i class="fas fa-arrow-left me-1"></i>Volver al sitio
                                            </a>
                                            <button class="btn btn-primary" type="submit">
                                                Iniciar Sesión
                                                <i class="fas fa-sign-in-alt ms-2"></i>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center py-3">
                                    <div class="small text-muted">
                                        Carpentry y Acabados SYC &copy; 2025
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div id="layoutAuthentication_footer">
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; Carpentry y Acabados SYC 2025</div>
                        <div>
                            <a href="#">Política de Privacidad</a>
                            &middot;
                            <a href="#">Términos y Condiciones</a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/scripts.js}"></script>
</body>
</html>
