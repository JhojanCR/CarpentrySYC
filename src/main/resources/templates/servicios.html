<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | Carpentry y Acabados SYC</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--Barra de navegación-->
    <header th:replace="index :: navbar"></header>
    
    <!--Sección de Servicios-->
    <section class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-4">Nuestros Servicios</h2>
            <!--Tarjetas de servicios-->
            <div class="row">
                <div class="col-md-4" th:each="servicios : ${servicios}">   
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 th:text="${servicios.nombre}" class="card-title"></h5>
                            <p th:text="${servicios.descripcion}" class="card-text"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!--Footer-->
    <footer th:replace="index :: footer"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
