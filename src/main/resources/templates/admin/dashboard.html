<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: body"></div>
    <div th:replace="fragments/sidebar :: *"></div>

    <div class="container-fluid px-4">
        <h1 class="mt-4">Dashboard</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item active">Panel administrativo</li>
        </ol>

        <!-- Tarjetas -->
        <div class="row">
            <div class="col-xl-3 col-md-6">
                <div class="card bg-primary text-white mb-4">
                    <div class="card-body">Servicios: <span th:text="${serviciosCount}">0</span></div>
                    <div class="card-footer d-flex align-items-center justify-content-between">
                        <a class="small text-white stretched-link" th:href="@{/admin/servicios}">Ver detalles</a>
                        <div class="small text-white"><i class="fas fa-angle-right"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card bg-warning text-white mb-4">
                    <div class="card-body">Proyectos: <span th:text="${proyectosCount}">0</span></div>
                    <div class="card-footer d-flex align-items-center justify-content-between">
                        <a class="small text-white stretched-link" th:href="@{/admin/proyectos}">Ver detalles</a>
                        <div class="small text-white"><i class="fas fa-angle-right"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card bg-success text-white mb-4">
                    <div class="card-body">Contactos: <span th:text="${contactosCount}">0</span></div>
                    <div class="card-footer d-flex align-items-center justify-content-between">
                        <a class="small text-white stretched-link" th:href="@{/admin/contactos}">Ver detalles</a>
                        <div class="small text-white"><i class="fas fa-angle-right"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card bg-danger text-white mb-4">
                    <div class="card-body">Usuarios: <span th:text="${usuariosCount}">0</span></div>
                    <div class="card-footer d-flex align-items-center justify-content-between">
                        <a class="small text-white stretched-link" th:href="@{/admin/usuarios}">Ver detalles</a>
                        <div class="small text-white"><i class="fas fa-angle-right"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráfico de ejemplo -->
        <div class="row">
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-chart-area me-1"></i>
                        Servicios contratados (mensual)
                    </div>
                    <div class="card-body">
                        <canvas id="myAreaChart" width="100%" height="40"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-chart-bar me-1"></i>
                        Proyectos entregados (mensual)
                    </div>
                    <div class="card-body">
                        <canvas id="myBarChart" width="100%" height="40"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: *"></div>

    <!-- Chart.js -->
    <script th:src="@{/assets/chart.js/chart.min.js}"></script>
    <script>
        // Area Chart ejemplo
        const ctxArea = document.getElementById("myAreaChart");
        new Chart(ctxArea, {
            type: 'line',
            data: {
                labels: ["Enero","Febrero","Marzo","Abril","Mayo","Junio"],
                datasets: [{
                    label: "Servicios",
                    data: [5, 8, 6, 10, 7, 12],
                    borderColor: "#007bff",
                    backgroundColor: "rgba(0,123,255,0.2)",
                }]
            }
        });

        // Bar Chart ejemplo
        const ctxBar = document.getElementById("myBarChart");
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ["Enero","Febrero","Marzo","Abril","Mayo","Junio"],
                datasets: [{
                    label: "Proyectos",
                    data: [3, 4, 2, 6, 5, 7],
                    backgroundColor: "rgba(220,53,69,0.7)",
                }]
            }
        });
    </script>
</body>
</html>
