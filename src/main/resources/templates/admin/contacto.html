<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: body"></div>
    <div th:replace="fragments/sidebar :: *"></div>

    <div class="container-fluid px-4">
        <h1 class="mt-4">Mensajes de Contacto</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Contacto</li>
        </ol>

        <!-- Tabla de mensajes -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-envelope me-1"></i>
                Mensajes Recibidos
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Asunto</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="contacto : ${contactos}">
                                <td th:text="${contacto.id}"></td>
                                <td th:text="${contacto.nombre}"></td>
                                <td th:text="${contacto.correo}"></td>
                                <td th:text="${contacto.telefono}"></td>
                                <td th:text="${contacto.asunto}"></td>
                                <td th:text="${#dates.format(contacto.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <button class="btn btn-sm btn-info" data-bs-toggle="modal" data-bs-target="#verMensajeModal" title="Ver mensaje">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(contactos)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    No hay mensajes de contacto
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver mensaje -->
    <div class="modal fade" id="verMensajeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles del Mensaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <strong>Nombre:</strong>
                        <p id="modalNombre"></p>
                    </div>
                    <div class="mb-3">
                        <strong>Correo:</strong>
                        <p id="modalCorreo"></p>
                    </div>
                    <div class="mb-3">
                        <strong>Teléfono:</strong>
                        <p id="modalTelefono"></p>
                    </div>
                    <div class="mb-3">
                        <strong>Asunto:</strong>
                        <p id="modalAsunto"></p>
                    </div>
                    <div class="mb-3">
                        <strong>Mensaje:</strong>
                        <p id="modalMensaje" style="white-space: pre-wrap;"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: *"></div>
    <script th:src="@{/js/scripts.js}"></script>
    <script th:src="@{/assets/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
