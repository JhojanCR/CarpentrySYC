<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Carpentry y Acabados SYC</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!--Barra de navegación-->
    <header th:replace="index :: navbar"></header>
    
    <!--Sección de Contacto-->
    <section class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-4">Contáctanos</h2>
            <!--Formulario de Contacto-->
            <form th:action="@{/contacto}" method="post">
                <div class="mb-3">
                    <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="mb-3">
                    <input type="email" name="correo" id="correo" class="form-control" placeholder="Correo" required>
                </div>
                <div class="mb-3">
                    <input type="tel" name="telefono" id="telefono" class="form-control" placeholder="Telefono" required>
                </div>
                <div class="mb-3">
                    <textarea name="mensaje" id="mensaje" cols="30" rows="10" class="form-control" placeholder="Mensaje" required></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </div>
            </form>
        </div>
    </section>

    <!--Footer-->
    <footer th:replace="index :: footer"></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
